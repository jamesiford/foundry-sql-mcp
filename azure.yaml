# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-sql-mcp
metadata:
  template: foundry-sql-mcp@0.1.0
infra:
  provider: bicep
  path: infra/demo
  module: main
hooks:
  preup:
    shell: pwsh
    run: ./scripts/prepare-demo-up.ps1
    interactive: true
    continueOnError: false
  postup:
    shell: pwsh
    run: ./scripts/complete-demo-up.ps1
    interactive: true
    continueOnError: false
